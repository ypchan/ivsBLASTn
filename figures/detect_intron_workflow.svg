<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">ivsBLASTn system workflow</title>
  <desc id="desc">Layered technical workflow from reference initialization and query BLAST through HSP geometry, breakpoint clustering, confidence scoring, and batch execution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker>
    <style>
      .bg{fill:#fff}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.3}.ref{fill:#ecfeff;stroke:#0891b2}.blast{fill:#eff6ff;stroke:#2563eb}.alg{fill:#f0fdf4;stroke:#16a34a}.out{fill:#f5f3ff;stroke:#7c3aed}.batch{fill:#fff7ed;stroke:#ea580c}.title{font:700 26px Arial,sans-serif;fill:#0f172a}.laneText{font:700 15px Arial,sans-serif;fill:#334155}.text{font:700 14px Arial,sans-serif;fill:#1e293b}.small{font:400 12px Arial,sans-serif;fill:#475569}.mono{font:700 12px Consolas,monospace;fill:#334155}.arrow{stroke:#334155;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="840"/>
  <text class="title" x="52" y="50">ivsBLASTn method and execution workflow</text>
  <text class="small" x="52" y="78">Reference initialization is reusable; query analysis is embarrassingly parallel across records or chunks.</text>

  <rect class="lane" x="48" y="110" width="1290" height="120" rx="10"/><text class="laneText" x="70" y="145">Reference layer</text>
  <rect class="box ref" x="205" y="132" width="190" height="70" rx="6"/><text class="text" x="230" y="160">SILVA FASTA</text><text class="small" x="230" y="182">taxonomy in header</text>
  <rect class="box ref" x="455" y="132" width="210" height="70" rx="6"/><text class="text" x="480" y="160">Select references</text><text class="small" x="480" y="182">domain, species, ATGC, length</text>
  <rect class="box ref" x="725" y="132" width="200" height="70" rx="6"/><text class="text" x="752" y="160">makeblastdb</text><text class="small" x="752" y="182">reusable DB prefix</text>
  <rect class="box ref" x="985" y="132" width="210" height="70" rx="6"/><text class="text" x="1012" y="160">reference.tax.tsv</text><text class="small" x="1012" y="182">subject taxonomy map</text>

  <rect class="lane" x="48" y="265" width="1290" height="120" rx="10"/><text class="laneText" x="70" y="300">BLAST layer</text>
  <rect class="box blast" x="205" y="287" width="190" height="70" rx="6"/><text class="text" x="230" y="315">Query FASTA</text><text class="small" x="230" y="337">single file or chunk</text>
  <rect class="box blast" x="455" y="287" width="210" height="70" rx="6"/><text class="text" x="480" y="315">BLASTN</text><text class="mono" x="480" y="337">top_subjects x max_hsps</text>
  <rect class="box blast" x="725" y="287" width="200" height="70" rx="6"/><text class="text" x="752" y="315">outfmt 6</text><text class="small" x="752" y="337">HSP table</text>
  <rect class="box blast" x="985" y="287" width="210" height="70" rx="6"/><text class="text" x="1012" y="315">Parse HSPs</text><text class="small" x="1012" y="337">query -> subject -> HSPs</text>

  <rect class="lane" x="48" y="420" width="1290" height="150" rx="10"/><text class="laneText" x="70" y="455">Algorithm layer</text>
  <rect class="box alg" x="205" y="445" width="190" height="82" rx="6"/><text class="text" x="230" y="474">Filter HSPs</text><text class="small" x="230" y="496">identity and length</text>
  <rect class="box alg" x="455" y="445" width="210" height="82" rx="6"/><text class="text" x="480" y="474">Pair geometry</text><text class="small" x="480" y="496">query gap, subject continuity</text>
  <rect class="box alg" x="725" y="445" width="200" height="82" rx="6"/><text class="text" x="752" y="474">Cluster breakpoints</text><text class="small" x="752" y="496">median coordinate window</text>
  <rect class="box alg" x="985" y="445" width="210" height="82" rx="6"/><text class="text" x="1012" y="474">Confidence</text><text class="small" x="1012" y="496">subjects and taxa</text>

  <rect class="lane" x="48" y="615" width="820" height="120" rx="10"/><text class="laneText" x="70" y="650">Output layer</text>
  <rect class="box out" x="205" y="637" width="190" height="70" rx="6"/><text class="text" x="230" y="665">TSV evidence</text><text class="small" x="230" y="687">summary, supporting HSPs</text>
  <rect class="box out" x="455" y="637" width="210" height="70" rx="6"/><text class="text" x="480" y="665">Sequence outputs</text><text class="small" x="480" y="687">intron-free, IVS FASTA</text>
  <rect class="box out" x="725" y="637" width="200" height="70" rx="6"/><text class="text" x="752" y="665">Coordinates</text><text class="small" x="752" y="687">BED and report</text>

  <rect class="lane" x="940" y="615" width="398" height="120" rx="10"/><text class="laneText" x="962" y="650">Batch layer</text>
  <rect class="box batch" x="1010" y="637" width="110" height="70" rx="6"/><text class="text" x="1033" y="665">split</text><text class="small" x="1022" y="687">chunks.tsv</text>
  <rect class="box batch" x="1145" y="637" width="110" height="70" rx="6"/><text class="text" x="1166" y="665">Slurm</text><text class="small" x="1157" y="687">array jobs</text>

  <path class="arrow" d="M395 167 H455"/><path class="arrow" d="M665 167 H725"/><path class="arrow" d="M925 167 H985"/>
  <path class="arrow" d="M395 322 H455"/><path class="arrow" d="M665 322 H725"/><path class="arrow" d="M925 322 H985"/>
  <path class="arrow" d="M395 486 H455"/><path class="arrow" d="M665 486 H725"/><path class="arrow" d="M925 486 H985"/>
  <path class="arrow" d="M395 672 H455"/><path class="arrow" d="M665 672 H725"/>
  <path class="dash" d="M825 202 V287"/><path class="dash" d="M300 357 V445"/><path class="dash" d="M1090 527 V637"/>
</svg>
