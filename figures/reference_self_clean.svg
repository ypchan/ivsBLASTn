<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Reference self-cleaning method</title>
  <desc id="desc">Algorithmic cycle for detecting and removing rare IVS intervals from reference records before final query analysis.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker>
    <style>
      .bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1}.raw{fill:#ecfeff;stroke:#0891b2}.detect{fill:#fff7ed;stroke:#ea580c}.clean{fill:#ecfdf5;stroke:#16a34a}.audit{fill:#f5f3ff;stroke:#7c3aed}.title{font:700 26px Arial,sans-serif;fill:#0f172a}.label{font:700 15px Arial,sans-serif;fill:#1e293b}.small{font:400 12px Arial,sans-serif;fill:#475569}.mono{font:700 13px Consolas,monospace;fill:#334155}.arrow{stroke:#334155;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:1.6;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="52" y="52">Reference self-cleaning</text>
  <text class="small" x="52" y="80">Designed for reference collections where IVS-bearing records are rare and can mask split-HSP evidence.</text>

  <rect class="panel raw" x="80" y="145" width="240" height="110" rx="8"/><text class="label" x="118" y="180">Raw selected reference</text><text class="small" x="118" y="205">raw_reference.fa</text><text class="small" x="118" y="225">raw_reference.tax.tsv</text>
  <rect class="panel raw" x="420" y="145" width="220" height="110" rx="8"/><text class="label" x="460" y="180">Raw DB</text><text class="small" x="460" y="205">makeblastdb</text><text class="small" x="460" y="225">raw_reference_db.*</text>
  <rect class="panel detect" x="760" y="120" width="310" height="160" rx="8"/><text class="label" x="800" y="155">Self-BLAST evidence scan</text><text class="small" x="800" y="182">each reference becomes query</text><text class="mono" x="800" y="215">query_gap &gt;= min_intron_len</text><text class="mono" x="800" y="240">abs(subject_gap) &lt;= max_ref_gap</text>

  <rect class="panel audit" x="140" y="430" width="280" height="130" rx="8"/><text class="label" x="180" y="465">Audit trail</text><text class="small" x="180" y="492">reference_self_clean.summary.tsv</text><text class="small" x="180" y="512">supporting_hsps.tsv</text><text class="small" x="180" y="532">report.md</text>
  <rect class="panel clean" x="545" y="405" width="305" height="180" rx="8"/><text class="label" x="585" y="440">Remove supported intervals</text><text class="small" x="585" y="466">only candidates passing</text><text class="mono" x="585" y="492">--ref-clean-min-confidence</text><text class="small" x="585" y="530">write cleaned_reference.fa</text><text class="small" x="585" y="550">build cleaned_reference_db.*</text>
  <rect class="panel clean" x="990" y="430" width="220" height="130" rx="8"/><text class="label" x="1030" y="465">Final query BLAST</text><text class="small" x="1030" y="492">uses cleaned DB</text><text class="small" x="1030" y="512">reduces reference masking</text>

  <path class="arrow" d="M320 200 H420"/><path class="arrow" d="M640 200 H760"/><path class="arrow" d="M915 280 C850 345, 760 380, 720 405"/><path class="arrow" d="M760 520 H990"/><path class="dash" d="M760 520 C590 610, 360 600, 280 560"/><path class="dash" d="M1100 430 C1130 280, 1040 230, 1070 200"/>
  <text class="small" x="880" y="635">Self-cleaning is optional; inspect audit outputs when reference modification is biologically sensitive.</text>
</svg>
