<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Confidence model decision matrix</title>
  <desc id="desc">Matrix and formulas for assigning HIGH, MEDIUM, LOW, or NONE confidence from subject and taxonomic support.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.grid{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}.head{fill:#e2e8f0}.high{fill:#bbf7d0}.med{fill:#fef08a}.low{fill:#fed7aa}.none{fill:#fecaca}.title{font:700 26px Arial,sans-serif;fill:#0f172a}.label{font:700 15px Arial,sans-serif;fill:#1e293b}.small{font:400 13px Arial,sans-serif;fill:#475569}.mono{font:700 14px Consolas,monospace;fill:#334155}.axis{font:700 14px Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="52" y="52">Confidence scoring model</text>
  <text class="small" x="52" y="80">Evidence tiering based on independent supporting subjects and taxonomic spread; not a probability model.</text>

  <rect class="grid" x="70" y="125" width="560" height="430" rx="8"/>
  <rect class="head" x="170" y="125" width="480" height="60"/>
  <rect class="head" x="70" y="185" width="100" height="360"/>
  <text class="axis" x="315" y="158">support_taxa at --tax-rank</text>
  <text class="axis" x="88" y="330" transform="rotate(-90 88 330)">support_subjects</text>

  <text class="label" x="210" y="222">0</text><text class="label" x="330" y="222">1-2</text><text class="label" x="465" y="222">>=3</text>
  <text class="label" x="112" y="285">0</text><text class="label" x="102" y="370">1-2</text><text class="label" x="98" y="455">>=3</text><text class="label" x="92" y="530">>=10</text>

  <rect class="none" x="170" y="245" width="160" height="80"/><rect class="none" x="330" y="245" width="160" height="80"/><rect class="none" x="490" y="245" width="160" height="80"/>
  <rect class="low" x="170" y="325" width="160" height="80"/><rect class="low" x="330" y="325" width="160" height="80"/><rect class="low" x="490" y="325" width="160" height="80"/>
  <rect class="low" x="170" y="405" width="160" height="80"/><rect class="low" x="330" y="405" width="160" height="80"/><rect class="med" x="490" y="405" width="160" height="80"/>
  <rect class="low" x="170" y="485" width="160" height="80"/><rect class="low" x="330" y="485" width="160" height="80"/><rect class="high" x="490" y="485" width="160" height="80"/>

  <text class="label" x="220" y="292">NONE</text><text class="label" x="380" y="292">NONE</text><text class="label" x="540" y="292">NONE</text>
  <text class="label" x="228" y="372">LOW</text><text class="label" x="388" y="372">LOW</text><text class="label" x="548" y="372">LOW</text>
  <text class="label" x="228" y="452">LOW</text><text class="label" x="388" y="452">LOW</text><text class="label" x="535" y="452">MEDIUM</text>
  <text class="label" x="228" y="532">LOW</text><text class="label" x="388" y="532">LOW</text><text class="label" x="542" y="532">HIGH</text>

  <rect class="grid" x="710" y="125" width="520" height="430" rx="8"/>
  <text class="label" x="750" y="170">Definitions</text>
  <text class="mono" x="760" y="212">support_subjects = count_unique(subject_id)</text>
  <text class="mono" x="760" y="250">support_taxa = count_unique(taxon_at_rank)</text>
  <text class="small" x="760" y="282">Default taxonomic rank is genus.</text>
  <text class="label" x="750" y="345">Cluster selection priority</text>
  <text class="mono" x="760" y="385">1. number of supporting subjects</text>
  <text class="mono" x="760" y="423">2. number of non-NA taxa</text>
  <text class="mono" x="760" y="461">3. sum(pair_score)</text>
  <text class="small" x="760" y="515">Each subject contributes at most one best HSP pair to a candidate breakpoint cluster.</text>
</svg>
