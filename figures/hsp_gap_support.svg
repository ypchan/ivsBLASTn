<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">HSP-gap support geometry</title>
  <desc id="desc">Technical diagram showing query-side IVS gap, subject-side near-continuity, coordinate formulas, and the non-supporting intron-bearing reference case.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <style>
      .bg{fill:#ffffff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}.axis{stroke:#334155;stroke-width:2}.thin{stroke:#64748b;stroke-width:1.2}.dash{stroke:#ef4444;stroke-width:2;stroke-dasharray:7 6}.hsp{fill:#2563eb}.ivs{fill:#f97316}.ref{fill:#16a34a}.risk{fill:#dc2626}.label{font:700 16px Arial,sans-serif;fill:#0f172a}.small{font:400 13px Arial,sans-serif;fill:#475569}.mono{font:700 14px Consolas,monospace;fill:#1e293b}.note{font:400 12px Arial,sans-serif;fill:#64748b}.arrow{stroke:#1f2937;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="label" x="48" y="48" style="font-size:26px">HSP-gap evidence model</text>
  <text class="small" x="48" y="76">A candidate IVS is supported when a large query interval is skipped while the reference subject remains nearly continuous.</text>

  <rect class="panel" x="48" y="112" width="1184" height="255" rx="10"/>
  <text class="label" x="78" y="148">Supporting case: IVS in query, absent from reference</text>

  <text class="small" x="78" y="205">query coordinates</text>
  <line class="axis" x1="250" y1="200" x2="1110" y2="200"/>
  <rect class="hsp" x="285" y="178" width="270" height="44" rx="5"/>
  <rect class="ivs" x="590" y="178" width="170" height="44" rx="5"/>
  <rect class="hsp" x="795" y="178" width="240" height="44" rx="5"/>
  <text class="mono" x="386" y="205" fill="#fff">HSP1</text>
  <text class="mono" x="625" y="205" fill="#fff">query_gap</text>
  <text class="mono" x="884" y="205" fill="#fff">HSP2</text>

  <text class="small" x="78" y="292">subject coordinates</text>
  <line class="axis" x1="250" y1="287" x2="1110" y2="287"/>
  <rect class="ref" x="285" y="265" width="345" height="44" rx="5"/>
  <rect class="ref" x="646" y="265" width="389" height="44" rx="5"/>
  <text class="mono" x="410" y="292" fill="#fff">left HSP</text>
  <text class="mono" x="770" y="292" fill="#fff">right HSP</text>
  <path class="dash" d="M630 287 H646"/>
  <text class="mono" x="535" y="342">abs(subject_gap) &lt;= max_ref_gap</text>

  <path class="thin" d="M555 226 V247"/>
  <path class="thin" d="M590 226 V247"/>
  <path class="thin" d="M760 226 V247"/>
  <path class="thin" d="M795 226 V247"/>
  <text class="note" x="560" y="246">left.qhi</text>
  <text class="note" x="742" y="246">right.qlo</text>

  <rect class="panel" x="48" y="395" width="560" height="250" rx="10"/>
  <text class="label" x="78" y="432">Coordinate tests</text>
  <text class="mono" x="92" y="474">query_gap = right.qlo - left.qhi - 1</text>
  <text class="mono" x="92" y="504">intron_start = left.qhi + 1</text>
  <text class="mono" x="92" y="534">intron_end   = right.qlo - 1</text>
  <text class="mono" x="92" y="574">subject_gap = right.slo - left.shi - 1</text>
  <text class="small" x="92" y="612">Accepted only when the query gap is IVS-sized and the subject gap is small.</text>

  <rect class="panel" x="640" y="395" width="592" height="250" rx="10"/>
  <text class="label" x="670" y="432">Non-supporting near-neighbor risk</text>
  <text class="small" x="670" y="464">If the reference already contains the same IVS, BLASTN may report one long high-similarity HSP.</text>
  <line class="axis" x1="700" y1="525" x2="1160" y2="525"/>
  <rect class="risk" x="745" y="503" width="370" height="44" rx="5"/>
  <line class="dash" x1="885" y1="525" x2="970" y2="525"/>
  <text class="mono" x="820" y="530" fill="#fff">single ungapped hit</text>
  <text class="small" x="670" y="590">Mitigation: reference self-cleaning and multiple near-best subjects.</text>
</svg>
