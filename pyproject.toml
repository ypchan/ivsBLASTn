[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ivsBLASTn"
version = "0.1.1"
description = "Detect intervening sequences in 16S/SSU rRNA sequences by BLASTN HSP geometry."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "rich",
    "rich-argparse",
]
authors = [
    { name = "ivsBLASTn contributors" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
ivsBLASTn = "ivsblastn.cli:main"

[tool.setuptools.packages.find]
include = ["ivsblastn*"]
