[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ivsBLASTn"
version = "0.1.0"
description = "Detect intervening sequences in 16S/SSU rRNA sequences by BLASTN HSP geometry."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich",
    "rich-argparse",
]
authors = [
    { name = "ivsBLASTn contributors" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
ivsBLASTn = "ivsblastn.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
